<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Activo Fijo · Sistema trasladado</title>
<style>
  *{box-sizing:border-box;margin:0}
  body{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px;
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;color:#eef0f3;
    background:linear-gradient(160deg,#0b2457 0%,#123a86 55%,#1a4ea8 100%)}
  .tarjeta{max-width:440px;width:100%;background:#222326;border:1px solid #36383d;border-radius:16px;padding:30px 28px;box-shadow:0 18px 50px rgba(0,0,0,.35)}
  .cab{display:flex;gap:14px;align-items:center;margin-bottom:18px}
  .logo{width:44px;height:44px;border-radius:12px;background:#1f56c3;display:flex;align-items:center;justify-content:center;flex:0 0 auto}
  h1{font-size:18px;line-height:1.3}
  .sub{font-size:12px;color:#7e848e;margin-top:2px}
  p{font-size:14px;line-height:1.6;color:#a5abb5;margin-top:10px}
  b{color:#eef0f3}
</style>
</head>
<body>
  <div class="tarjeta">
    <div class="cab">
      <div class="logo"><svg width="24" height="24" viewBox="0 0 40 40"><path d="M6 6 L22 6 L34 18 L18 34 L6 22 Z" fill="#fff"/><circle cx="12" cy="12" r="3" fill="#1f56c3"/></svg></div>
      <div><h1>El sistema de Activo Fijo se trasladó</h1><div class="sub">Hospital Nacional El Salvador · MINSAL</div></div>
    </div>
    <p>Esta dirección ya no se usa. El sistema ahora funciona dentro de <b>Google Workspace del MINSAL</b>, con tu correo institucional.</p>
    <p>Pide el enlace nuevo al administrador de Activo Fijo.</p>
  </div>
</body>
</html>
